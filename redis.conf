# Redis Security Configuration
# Password authentication (use strong password in production)
# Note: Password is set via command-line argument in docker-compose.yml
# This allows proper environment variable substitution

# ACL Configuration for enhanced security
# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
rename-command DEBUG ""

# Bind to all interfaces to allow Docker containers to connect
# Protected mode with password authentication ensures security
# Note: In production, consider restricting to Docker's internal network subnet
# for additional security (e.g., bind 172.0.0.0/8)
bind 0.0.0.0 ::0

# Enable protected mode
# With password authentication, this provides secure access control
protected-mode yes

# Maximum memory policy
# This Redis instance is the Celery BROKER (db 0) as well as the Channels layer
# (db 1). An eviction policy must never be used on a broker: under memory
# pressure Redis would evict whatever it liked, and the queued Celery task
# payloads and queue lists are just ordinary keys to it. Tasks would vanish
# mid-queue with no error on either side -- the webhook returns 200, the worker
# never receives anything, and the bot simply stops replying after the instance
# has been up long enough to fill 256mb. That is silent data loss, and it was
# the configured behaviour here (allkeys-lru).
#
# noeviction makes a full broker fail LOUDLY instead: the producer gets an OOM
# error it can log and act on. Callers on the request path are wrapped
# accordingly (MetaWebhookAPIView._safe_delay, meta_integration.utils.
# queue_whatsapp_message, stats/signals.py), and outgoing messages are already
# persisted as 'pending_dispatch' rows before dispatch, so the work stays
# recoverable rather than disappearing.
#
# Headroom raised alongside it, since with noeviction the ceiling is a hard
# failure rather than a quiet cleanup. Still a small fraction of the host's RAM.
maxmemory 512mb
maxmemory-policy noeviction

# Persistence configuration
save 900 1
save 300 10
save 60 10000

# Append only file (AOF) for better persistence
appendonly yes
appendfsync everysec